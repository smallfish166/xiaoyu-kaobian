<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#FFF7F0;--surface:#FFFFFF;--text:#3D2C2C;--text-secondary:#8B7B7B;--border:#F0D5C0;--primary:#FF7F50;--primary-light:#FFF0E8;--primary-dark:#E5693C;--accent:#FFAB76;--success:#6BBF6B;--danger:#F27E7E;--radius:20px;--shadow:0 4px 15px rgba(255,127,80,0.1);--font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding-bottom:70px}
    .sidebar{position:fixed;top:0;left:0;width:280px;max-width:80vw;height:100%;background:var(--surface);box-shadow:4px 0 20px rgba(0,0,0,0.1);z-index:1000;transform:translateX(-100%);transition:transform 0.3s;overflow-y:auto;padding:20px 12px;-webkit-overflow-scrolling:touch}
    .sidebar.open{transform:translateX(0)}
    .sidebar-header{font-weight:700;font-size:1.4rem;color:var(--primary-dark);text-align:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px dashed var(--accent)}
    .nav-item{padding:12px 16px;margin-bottom:4px;border-radius:14px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
    .nav-item:active{background:var(--primary-light)}
    .nav-item .arrow{margin-left:auto;transition:transform 0.2s}
    .nav-item.expanded .arrow{transform:rotate(90deg)}
    .sub-nav{display:none;padding-left:16px;margin-bottom:6px}
    .sub-nav.show{display:block}
    .sub-item{padding:10px 14px;border-radius:12px;font-size:0.9rem;cursor:pointer;color:var(--text-secondary);margin-bottom:3px}
    .sub-item:active{background:var(--primary-light);color:var(--primary-dark)}
    .overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:999;opacity:0;visibility:hidden;transition:opacity 0.3s}
    .overlay.show{opacity:1;visibility:visible}
    .main-content{padding:16px 16px 80px;max-width:600px;margin:0 auto;min-height:100vh}
    .top-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
    .menu-btn{background:var(--primary-light);border:none;width:44px;height:44px;border-radius:14px;font-size:1.4rem;display:flex;align-items:center;justify-content:center;color:var(--primary-dark);cursor:pointer}
    .card{background:var(--surface);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border);position:relative;overflow:hidden}
    .card-row{display:flex;gap:12px;flex-wrap:wrap}
    .quick-card{flex:1;min-width:120px;background:var(--primary-light);border-radius:18px;padding:16px;text-align:center;font-weight:600;color:var(--primary-dark);cursor:pointer}
    .quick-card:active{transform:scale(0.97)}
    button.primary{background:var(--primary);color:white;border:none;padding:12px 20px;border-radius:14px;font-weight:600;cursor:pointer;width:100%;font-size:1rem;margin:8px 0}
    button.secondary{background:transparent;border:1px solid var(--border);padding:10px 16px;border-radius:12px;color:var(--text);cursor:pointer;font-size:0.9rem}
    .question-text{font-size:1.1rem;line-height:1.6;margin-bottom:16px;font-weight:500}
    .option{display:block;padding:14px;margin-bottom:8px;background:var(--bg);border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:0.1s}
    .option.selected{border-color:var(--primary);background:var(--primary-light)}
    .tag{background:var(--primary-light);color:var(--primary-dark);padding:4px 10px;border-radius:16px;font-size:0.8rem;font-weight:600}
    .timer{font-size:1.3rem;font-weight:700;color:var(--danger);text-align:center;margin:10px 0}
    .progress-bar{height:8px;background:var(--border);border-radius:8px;margin:10px 0;overflow:hidden}
    .progress-fill{height:100%;background:var(--accent);border-radius:8px;transition:width 0.3s}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 12px;z-index:900;transition:transform 0.3s}
    .bottom-nav.hidden{transform:translateY(100%)}
    .nav-icon{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:0.75rem;color:var(--text-secondary);cursor:pointer;padding:4px 8px}
    .nav-icon.active{color:var(--primary-dark);font-weight:600}
    .answer-card{background:#FFF9F5;border-left:4px solid var(--accent);padding:12px;border-radius:12px;margin-top:12px;font-size:0.9rem}
    textarea,input,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px;font-family:inherit;margin:6px 0;font-size:0.9rem}
    .hidden{display:none!important}
    .kb-item{margin:4px 0; border-left:2px solid var(--border); padding-left:12px;}
    .kb-folder{cursor:pointer; font-weight:600; display:flex; align-items:center; gap:6px; justify-content:space-between;}
    .kb-children{margin-left:16px; display:block;}
    .kb-children.hidden{display:none;}
    .scratchpad{border:1px solid var(--border); border-radius:12px; margin:12px 0; touch-action:none;}
    canvas{display:block; width:100%; background:white; border-radius:8px;}
    #markCanvas{position:absolute; top:0; left:0; pointer-events:auto; z-index:10; background:transparent!important;}
  </style>
</head>
<body>
  <div class="sidebar" id="sidebar"><div class="sidebar-header">🐠 小鱼的工作台</div><div id="navTree"></div></div>
  <div class="overlay" id="overlay"></div>

  <div class="main-content" id="mainContent">
    <div class="top-bar"><button class="menu-btn" id="menuBtn">📋</button><div class="greeting" id="greeting">☀️ 早上好，小鱼</div></div>
    <div id="viewContainer"></div>
  </div>

  <div class="bottom-nav" id="bottomNav">
    <div class="nav-icon active" data-tab="home"><span>🏠</span><span>首页</span></div>
    <div class="nav-icon" data-tab="practice"><span>📝</span><span>刷题</span></div>
    <div class="nav-icon" data-tab="exam"><span>⏱</span><span>模考</span></div>
    <div class="nav-icon" data-tab="wrong"><span>❤️</span><span>错题</span></div>
  </div>

<script>
// ==================== 数据管理 ====================
const STORAGE_KEY = 'xiaoyu_complete_v3';
let appData = {
  questions: [],
  wrongIds: [],
  dailyLog: {},
  progress: {},
  knowledgeBase: {},
  examHistory: [],
  customCategories: {}
};

const eduChapters = ['第1章 教育与教育学','第2章 教育与社会发展','第3章 教育与人的发展','第4章 教育目的','第5章 教师与学生','第6章 课程','第7章 教学（上）','第8章 教学（下）','第9章 德育','第10章 班级管理与教育研究'];
const psyChapters = ['第1章 教育心理学概述','第2章 心理发展与教育','第3章 学习理论','第4章 学习动机','第5章 学习迁移','第6章 知识与技能','第7章 问题解决与创造性','第8章 态度与品德','第9章 心理健康教育'];

function getDefaultQuestions() {
  return [
    { id:'q1', type:'single', module:'常识判断', question:'事业单位公开招聘程序的第一步是？', options:['A.制定招聘方案','B.发布公告','C.报名审查','D.考试考核'], answer:'A', analysis:'根据《事业单位人事管理条例》。' },
    { id:'q2', type:'single', module:'言语理解', question:'填入横线最恰当的是：阅读经典可以____心灵，____智慧。', options:['A.净化 启迪','B.荡涤 启发','C.洗礼 开发','D.清洁 启示'], answer:'A', analysis:'“净化心灵、启迪智慧”为固定搭配。' },
    { id:'q3', type:'single', module:'数量关系', question:'某班40人，语文及格35人，数学及格30人，两科不及格3人，两科都及格多少人？', options:['A.28','B.30','C.32','D.34'], answer:'A', analysis:'35+30-(40-3)=28。' },
    { id:'q4', type:'single', module:'判断推理', question:'所有教师都是知识分子，有些知识分子是党员，所以？', options:['A.有些教师是党员','B.所有党员是知识分子','C.有些党员是教师','D.无法确定'], answer:'D', analysis:'三段论推理无法必然推出。' },
    { id:'q5', type:'single', module:'资料分析', question:'2022年增长6%，2023年增长8%，则两年平均增长约为？', options:['A.6.99%','B.7.0%','C.7.1%','D.7.2%'], answer:'A', analysis:'年均增长率近似计算。' },
    { id:'q6', type:'single', module:'教育学', chapter:'第4章 教育目的', question:'我国教育目的的理论基础是？', options:['A.素质教育理论','B.马克思主义人的全面发展学说','C.核心素养理论','D.建构主义'], answer:'B', analysis:'马克思主义关于人的全面发展学说是我国教育目的的理论基础。' },
    { id:'q7', type:'multi', module:'教育学', chapter:'第6章 课程', question:'以下属于课程目标特点的有？', options:['A.整体性','B.阶段性','C.持续性','D.层次性'], answer:'ABCD', analysis:'课程目标具有整体性、阶段性、持续性、层次性等特点。' },
    { id:'q8', type:'fill', module:'教育心理学', chapter:'第2章 心理发展与教育', question:'皮亚杰将儿童认知发展分为四个阶段，其中7-11岁处于______阶段。', answer:'具体运算', analysis:'7-11岁对应具体运算阶段。' },
    { id:'q9', type:'short', module:'教育学', chapter:'第7章 教学（上）', question:'简述启发性教学原则的基本要求。', answer:'①调动学生主动性②启发独立思考③动手解决④发扬教学民主', analysis:'启发性原则是重要教学原则。' },
    { id:'q10', type:'case', module:'教育心理学', chapter:'第4章 学习动机', question:'王老师发现小明因家庭原因学习动机减弱，请分析如何激发。', answer:'内部动机激发、外部奖励、增强归属感、提升自我效能感。', analysis:'教育心理学案例分析。' }
  ];
}

function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try { appData = JSON.parse(saved); } catch(e) { resetData(); }
    if (!appData.questions.length) appData.questions = getDefaultQuestions();
    if (!appData.knowledgeBase) appData.knowledgeBase = {};
    if (!appData.customCategories) appData.customCategories = {};
  } else { resetData(); }
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); }
function resetData() {
  appData = { questions: getDefaultQuestions(), wrongIds: [], dailyLog: {}, progress: {}, knowledgeBase: {}, examHistory: [], customCategories: {} };
  saveData();
}

// ==================== 导航树 ====================
function getNavStructure() {
  return [
    { label:'🧠 职测', children:[
      { label:'常识判断', module:'常识判断' },{ label:'言语理解', module:'言语理解' },{ label:'数量关系', module:'数量关系' },
      { label:'判断推理', module:'判断推理' },{ label:'资料分析', module:'资料分析' },
      { label:'✨ 自定义', isCustom:true, module:'职测' },{ label:'📒 知识库', module:'职测', isKnowledge:true }
    ]},
    { label:'📝 综应', children:[
      { label:'教育案例分析', module:'综应', chapter:'教育案例分析' },{ label:'教育方案设计', module:'综应', chapter:'教育方案设计' },
      { label:'教育写作', module:'综应', chapter:'教育写作' },
      { label:'✨ 自定义', isCustom:true, module:'综应' },{ label:'📒 知识库', module:'综应', isKnowledge:true }
    ]},
    { label:'📄 申论', children:[
      { label:'概括归纳题', module:'申论', chapter:'概括归纳题' },{ label:'提出对策题', module:'申论', chapter:'提出对策题' },
      { label:'综合分析题', module:'申论', chapter:'综合分析题' },{ label:'大作文', module:'申论', chapter:'大作文' },
      { label:'✨ 自定义', isCustom:true, module:'申论' },{ label:'📒 知识库', module:'申论', isKnowledge:true }
    ]},
    { label:'📖 教育学', children:[
      { label:'📋 按题型', children:[{ label:'单选', module:'教育学', type:'single' },{ label:'多选', module:'教育学', type:'multi' },{ label:'填空', module:'教育学', type:'fill' },{ label:'简答', module:'教育学', type:'short' },{ label:'论述', module:'教育学', type:'short' },{ label:'案例分析', module:'教育学', type:'case' }] },
      { label:'📂 按章节', children: eduChapters.map(ch=>({ label:ch, module:'教育学', chapter:ch })) },
      { label:'✨ 自定义', isCustom:true, module:'教育学' },{ label:'📒 知识库', module:'教育学', isKnowledge:true }
    ]},
    { label:'🧪 教育心理学', children:[
      { label:'📋 按题型', children:[{ label:'单选', module:'教育心理学', type:'single' },{ label:'多选', module:'教育心理学', type:'multi' },{ label:'填空', module:'教育心理学', type:'fill' },{ label:'简答', module:'教育心理学', type:'short' },{ label:'论述', module:'教育心理学', type:'short' },{ label:'案例分析', module:'教育心理学', type:'case' }] },
      { label:'📂 按章节', children: psyChapters.map(ch=>({ label:ch, module:'教育心理学', chapter:ch })) },
      { label:'✨ 自定义', isCustom:true, module:'教育心理学' },{ label:'📒 知识库', module:'教育心理学', isKnowledge:true }
    ]},
    { label:'📊 学习报告', isReport:true },{ label:'⚙️ 管理', isManage:true }
  ];
}

function renderNavTree() {
  const nav = getNavStructure();
  let h='';
  nav.forEach((item,idx)=>{
    if(item.isReport) h+=`<div class="nav-item" onclick="showReport()">📊 学习报告</div>`;
    else if(item.isManage) h+=`<div class="nav-item" onclick="showManage()">⚙️ 管理</div>`;
    else {
      h+=`<div class="nav-item" onclick="toggleNavItem(this,${idx})">${item.label} <span class="arrow">▶</span></div>`;
      h+=`<div class="sub-nav" id="subNav${idx}">`;
      item.children?.forEach((child,childIdx)=>{
        if(child.children){
          h+=`<div class="sub-item" onclick="event.stopPropagation();toggleSubSub(event,${idx},${childIdx})">${child.label} <span style="margin-left:auto;">▶</span></div>`;
          h+=`<div class="sub-nav" id="subSub${idx}_${childIdx}" style="padding-left:16px;">`;
          child.children.forEach(g=>h+=`<div class="sub-item" onclick="selectFilter('${g.module||''}','${g.type||''}','${g.chapter||''}')">${g.label}</div>`);
          h+=`</div>`;
        }else if(child.isCustom){
          const mod = child.module;
          const cats = appData.customCategories[mod] || [];
          h+=`<div class="sub-item" onclick="event.stopPropagation();toggleSubSub(event,${idx},${childIdx})">✨ 自定义 <span style="margin-left:auto;">▶</span></div>`;
          h+=`<div class="sub-nav" id="subSub${idx}_${childIdx}" style="padding-left:16px;">`;
          cats.forEach(cat => h+=`<div class="sub-item" onclick="selectFilter('${mod}','','${cat}')">📌 ${cat}</div>`);
          h+=`<div class="sub-item" onclick="manageCustom('${mod}')" style="color:var(--primary-dark);font-weight:600;">⚙️ 管理自定义</div>`;
          h+=`</div>`;
        }else if(child.isKnowledge) h+=`<div class="sub-item" onclick="openKnowledge('${child.module}')">📒 知识库</div>`;
        else h+=`<div class="sub-item" onclick="selectFilter('${child.module||''}','${child.type||''}','${child.chapter||''}')">${child.label}</div>`;
      });
      h+=`</div>`;
    }
  });
  document.getElementById('navTree').innerHTML=h;
}
window.toggleNavItem=(el,idx)=>{document.getElementById('subNav'+idx).classList.toggle('show');el.classList.toggle('expanded');};
window.toggleSubSub=(e,pi,ci)=>{e.stopPropagation();document.getElementById(`subSub${pi}_${ci}`).classList.toggle('show');e.currentTarget.classList.toggle('expanded');};

// ==================== 自定义分类管理 ====================
window.manageCustom = function(mod) {
  const cats = appData.customCategories[mod] || [];
  let h = `<div class="card"><h3>✨ ${mod} - 自定义分类</h3>`;
  if(cats.length === 0) h += '<p>暂无自定义分类</p>';
  cats.forEach((cat, i) => {
    h += `<div style="display:flex; justify-content:space-between; margin:8px 0;">
      <span>📌 ${cat}</span>
      <span>
        <button class="secondary" onclick="renameCustom('${mod}', ${i})">重命名</button>
        <button class="secondary" onclick="deleteCustom('${mod}', ${i})">删除</button>
      </span>
    </div>`;
  });
  h += `<hr><input id="newCatName" placeholder="新分类名称"><button class="primary" onclick="addCustom('${mod}')">添加</button>`;
  h += `<button class="secondary" onclick="closeSidebar();switchMainTab('home');" style="margin-top:8px;">返回首页</button></div>`;
  document.getElementById('viewContainer').innerHTML = h;
  closeSidebar();
};
window.addCustom = function(mod) {
  const name = document.getElementById('newCatName').value.trim();
  if(!name) return alert('请输入名称');
  if(!appData.customCategories[mod]) appData.customCategories[mod] = [];
  if(appData.customCategories[mod].includes(name)) return alert('已存在同名分类');
  appData.customCategories[mod].push(name);
  saveData(); renderNavTree(); manageCustom(mod);
};
window.renameCustom = function(mod, idx) {
  const newName = prompt('重命名为：', appData.customCategories[mod][idx]);
  if(newName && newName.trim()) { appData.customCategories[mod][idx] = newName.trim(); saveData(); renderNavTree(); manageCustom(mod); }
};
window.deleteCustom = function(mod, idx) {
  if(confirm('确定删除？')) { appData.customCategories[mod].splice(idx,1); saveData(); renderNavTree(); manageCustom(mod); }
};

// ==================== 侧边栏与导航 ====================
const sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
document.getElementById('menuBtn').addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show');});
overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show');});
function closeSidebar(){sidebar.classList.remove('open');overlay.classList.remove('show');}

let mainTab='home',filter={},pQ=[],pI=0,ua={},showA={},scratchVisible=false,markMode=false;
document.querySelectorAll('.nav-icon').forEach(i=>i.addEventListener('click',function(){
  const t=this.dataset.tab;
  if(t==='practice'&&!filter.module&&!filter.chapter){alert('请先从侧边栏选择刷题模块');return;}
  mainTab=t;renderView();document.querySelectorAll('.nav-icon').forEach(i=>i.classList.remove('active'));this.classList.add('active');
}));
let lastY=0;window.addEventListener('scroll',()=>{const s=window.scrollY;document.getElementById('bottomNav').classList.toggle('hidden',s>lastY&&s>50);lastY=s;});

function switchMainTab(t){mainTab=t;renderView();}
function renderView(){
  switch(mainTab){
    case'home':renderHome();break;
    case'practice':startPractice();break;
    case'exam':renderExamSetup();break;
    case'wrong':renderWrongBook();break;
  }
}
function renderHome(){
  const t=new Date().toISOString().slice(0,10),l=appData.dailyLog[t]||{count:0,correct:0},w=appData.wrongIds.length;
  document.getElementById('viewContainer').innerHTML=`
    <div class="card" style="background:linear-gradient(135deg,#FFAB76,#FF7F50);color:white;">
      <div style="font-size:1.4rem;font-weight:700;">📅 今日打卡</div><div style="margin:10px 0;">已刷<strong>${l.count}</strong>题 | 正确<strong>${l.correct}</strong>题</div>

// ==================== 刷题逻辑 ====================
function getFilteredQs(){
  return appData.questions.filter(q=>{
    if(filter.module&&q.module!==filter.module)return false;
    if(filter.chapter){
      if(filter.chapter==='自定义') return !q.chapter || q.chapter === '';
      if(q.chapter!==filter.chapter)return false;
    }
    if(filter.type&&q.type!==filter.type)return false;
    return true;
  }).sort((a,b)=>a.id.localeCompare(b.id));
}
function getPK(){let k=filter.module||'all';if(filter.chapter)k+='_'+filter.chapter;if(filter.type)k+='_'+filter.type;return k;}

function startPractice(mode='all',n=0){
  const qs=getFilteredQs();if(!qs.length){document.getElementById('viewContainer').innerHTML='<div class="card">📭 暂无题目</div>';return;}
  const pk=getPK();let s=appData.progress[pk]||0;if(s>=qs.length)s=0;
  pQ=mode==='all'?qs:qs.slice(s,s+n);pI=0;ua={};showA={};scratchVisible=false;markMode=false;renderPV();
}
function renderPV(){
  if(!pQ.length){document.getElementById('viewContainer').innerHTML='<div class="card">📭 没有可刷的题目</div>';return;}
  if(pI>=pQ.length)pI=0;const q=pQ[pI],t=pQ.length,a=Object.keys(ua).length;
  let h=`<div class="card" id="questionCard"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span class="tag">${q.module||''} ${q.chapter||''}</span><span>${pI+1}/${t}</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(a/t)*100}%"></div></div><div class="question-text">${q.question}</div>`;
  h+=renderQB(q);
  h+=`<div style="margin-top:12px;">${ua[q.id]&&!showA[q.id]?`<button class="primary" onclick="checkAnswer('${q.id}')">✅ 核对答案</button>`:''}</div>`;
  if(showA[q.id])h+=renderAC(q);
  h+=`<div style="display:flex;gap:8px;margin-top:8px;">
    <button class="secondary" onclick="toggleScratch()">✏️ 草稿纸</button>
    <button class="secondary" onclick="toggleMarkMode()">${markMode ? '⏹ 关闭标记' : '🔴 标记笔'}</button>
  </div>`;
  if(scratchVisible) h+=renderScratchpad();
  h+=`<div style="display:flex;gap:8px;margin-top:14px;"><button class="secondary" onclick="prevQ()">⬅ 上一题</button><button class="secondary" onclick="nextQ()">下一题 ➡</button></div></div>
    <div class="card"><div style="display:flex;gap:8px;justify-content:center;"><button class="secondary" onclick="startPractice('all')">📚 全部题目</button><button class="secondary" onclick="customNum()">🔢 自定义数量</button></div></div>`;
  document.getElementById('viewContainer').innerHTML=h;
  if(scratchVisible) initScratchCanvas();
  if(markMode) enableMarkMode();
}

function renderQB(q){
  const u=ua[q.id]||'';
  switch(q.type){
    case'single':case'multi':return q.options.map(o=>{const s=q.type==='single'?u===o.charAt(0):u.includes(o.charAt(0));return`<div class="option ${s?'selected':''}" onclick="selectOpt('${q.id}','${o.charAt(0)}')">${o}</div>`;}).join('');
    default:return`<textarea class="answer-input" placeholder="输入答案" onchange="ua['${q.id}']=this.value">${u}</textarea>`;
  }
}
function renderAC(q){
  const u=ua[q.id]||'';let c=false;
  if(q.type==='single')c=u===q.answer;else if(q.type==='multi')c=u.split('').sort().join('')===q.answer.split('').sort().join('');else c=u.trim()===q.answer.trim();
  return`<div class="answer-card"><div style="font-weight:700;color:${c?'var(--success)':'var(--danger)'};">${c?'✅ 正确':'❌ 错误'}</div><div style="margin-top:6px;"><strong>正确答案：</strong>${q.answer}</div>${u?`<div><strong>你的答案：</strong>${u}</div>`:''}${q.analysis?`<div style="margin-top:4px;color:var(--text-secondary);"><strong>解析：</strong>${q.analysis}</div>`:''}</div>`;
}

// 草稿纸（修正触摸偏移）
function renderScratchpad(){
  return `<div class="scratchpad"><canvas id="scratchCanvas" width="300" height="200"></canvas><button class="secondary" onclick="clearScratch()" style="margin-top:4px;">🗑 清除</button></div>`;
}
function initScratchCanvas(){
  const canvas = document.getElementById('scratchCanvas');if(!canvas) return;
  const container = canvas.parentElement;
  const maxWidth = container.clientWidth - 24;
  canvas.width = Math.min(maxWidth, 600);
  canvas.height = canvas.width * 0.6;
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let drawing = false;
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }
  function startDraw(e) { e.preventDefault(); drawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); }
  function draw(e) { if (!drawing) return; e.preventDefault(); const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); }
  function endDraw() { drawing = false; }
  canvas.onmousedown = canvas.onmousemove = canvas.onmouseup = canvas.onmouseleave = null;
  canvas.ontouchstart = canvas.ontouchmove = canvas.ontouchend = null;
  canvas.addEventListener('mousedown', startDraw); canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw); canvas.addEventListener('mouseleave', endDraw);
  canvas.addEventListener('touchstart', startDraw, { passive: false }); canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', endDraw);
}
window.toggleScratch = function(){ scratchVisible = !scratchVisible; renderPV(); };
window.clearScratch = function(){ const canvas = document.getElementById('scratchCanvas'); if(canvas) canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height); };

// 标记笔（透明背景，直接在题目上圈画）
function toggleMarkMode(){
  markMode = !markMode;

function enableMarkMode(){
  const card = document.getElementById('questionCard');
  if(!card) return;
  const existing = document.getElementById('markCanvas');
  if(existing) existing.remove();
  const canvas = document.createElement('canvas');
  canvas.id = 'markCanvas';
  canvas.style.position = 'absolute';
  canvas.style.top = '0'; canvas.style.left = '0';
  canvas.style.width = '100%'; canvas.style.height = '100%';
  canvas.style.pointerEvents = 'auto';
  canvas.style.background = 'transparent';
  card.style.position = 'relative';
  card.appendChild(canvas);
  const rect = card.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = rect.height;
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#FF0000'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let drawing = false;
  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const sx = canvas.width / r.width; const sy = canvas.height / r.height;
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx - r.left) * sx, y: (cy - r.top) * sy };
  }
  function startDraw(e) { e.preventDefault(); drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
  function draw(e) { if (!drawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
  function endDraw() { drawing = false; }
  canvas.addEventListener('mousedown', startDraw); canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw); canvas.addEventListener('mouseleave', endDraw);
  canvas.addEventListener('touchstart', startDraw, { passive: false }); canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', endDraw);
  const options = card.querySelectorAll('.option');
  options.forEach(opt => opt.style.pointerEvents = 'none');
}

window.batchImport=function(){
  const qText=document.getElementById('batchQuestions').value.trim();
  const aText=document.getElementById('batchAnswers').value.trim();
  if(!qText||!aText)return alert('请粘贴题目和答案');
  const module=document.getElementById('batchModule').value;
  const chapter=document.getElementById('batchChapter').value;
  const qBlocks=qText.split(/\n(?=\d+\.)/);
  const aBlocks=aText.split(/\n(?=\d+\.)/);
  if(qBlocks.length!==aBlocks.length)return alert('数量不匹配');
  for(let i=0;i<qBlocks.length;i++){
    const lines=qBlocks[i].trim().split('\n');
    const questionText=lines[0].replace(/^\d+\.\s*/,'');
    const options=lines.filter(l=>/^[A-D]\./.test(l));
    const type=options.length>0?'single':'fill';
    const aMatch=aBlocks[i].match(/^\d+\.\s*(.+)/);
    let answer='',analysis='';
    if(aMatch){const parts=aMatch[1].split(/解析[：:]/);answer=parts[0].trim();analysis=parts[1]?parts[1].trim():'';}
    appData.questions.push({id:'q'+Date.now()+Math.random()+i,type,module,chapter,question:questionText,options,answer,analysis});
  }
  saveData();alert(`导入 ${qBlocks.length} 题`);showManage();
};

      h+=`<div class="kb-item"><div class="kb-folder" onclick="toggleKBFolder('${m}',${i})">📁 ${entry.title} <span style="margin-left:auto;">${entry.expanded?'▼':'▶'}</span></div><div class="kb-children ${entry.expanded?'':'hidden'}" id="kbChildren${m}_${i}">`;
      if(entry.children) entry.children.forEach((child,ci)=>h+=renderKBItem(m,i,child,ci));
      h+=`<button class="secondary" onclick="addKBItem('${m}',${i})" style="margin-top:4px;">+ 添加子项</button></div></div>`;
    } else if(entry.type==='link'){
      h+=`<div class="kb-item"><span>📎 <a href="${entry.url}" target="_blank">${entry.title}</a></span> <button class="secondary" onclick="moveKB('${m}',${i},-1)">↑</button> <button class="secondary" onclick="moveKB('${m}',${i},1)">↓</button> <button class="secondary" onclick="deleteKB('${m}',${i})">✕</button></div>`;
    } else {
      h+=`<div class="kb-item"><strong>📝 ${entry.title}</strong><p style="white-space:pre-wrap;">${entry.content}</p> <button class="secondary" onclick="moveKB('${m}',${i},-1)">↑</button> <button class="secondary" onclick="moveKB('${m}',${i},1)">↓</button> <button class="secondary" onclick="deleteKB('${m}',${i})">✕</button></div>`;
    }
  });
  h+=`<hr><input id="kTitle" placeholder="标题"><select id="kType"><option value="link">📎 链接</option><option value="note">📝 笔记</option><option value="folder">📁 文件夹</option></select><input id="kLink" placeholder="链接地址" style="display:none;"><textarea id="kContent" placeholder="笔记内容" style="display:none;" rows="3"></textarea><button class="primary" onclick="addKB('${m}')">添加</button></div>`;
  document.getElementById('viewContainer').innerHTML=h;
  document.getElementById('kType').addEventListener('change',function(){
    document.getElementById('kLink').style.display=this.value==='link'?'block':'none';
    document.getElementById('kContent').style.display=this.value==='note'?'block':'none';
  });
}
function renderKBItem(module,parentIdx,child,childIdx){
  if(child.type==='link') return `<div class="kb-item"><span>📎 <a href="${child.url}" target="_blank">${child.title}</a></span> <button class="secondary" onclick="moveKBS('${module}',${parentIdx},${childIdx},-1)">↑</button> <button class="secondary" onclick="moveKBS('${module}',${parentIdx},${childIdx},1)">↓</button> <button class="secondary" onclick="deleteKBS('${module}',${parentIdx},${childIdx})">✕</button></div>`;
  return `<div class="kb-item"><strong>📝 ${child.title}</strong><p>${child.content}</p> <button class="secondary" onclick="moveKBS('${module}',${parentIdx},${childIdx},-1)">↑</button> <button class="secondary" onclick="moveKBS('${module}',${parentIdx},${childIdx},1)">↓</button> <button class="secondary" onclick="deleteKBS('${module}',${parentIdx},${childIdx})">✕</button></div>`;
}
window.toggleKBFolder=function(m,idx){appData.knowledgeBase[m][idx].expanded=!appData.knowledgeBase[m][idx].expanded;saveData();renderKnowledge(m);};
window.addKB=function(m){const t=document.getElementById('kType').value,title=document.getElementById('kTitle').value||'未命名';if(t==='link'){const url=document.getElementById('kLink').value;if(!url)return alert('请输入链接');appData.knowledgeBase[m].push({type:'link',title,url});}else if(t==='note'){const content=document.getElementById('kContent').value;if(!content)return alert('请输入内容');appData.knowledgeBase[m].push({type:'note',title,content});}else{appData.knowledgeBase[m].push({type:'folder',title,expanded:true,children:[]});}saveData();renderKnowledge(m);};
window.addKBItem=function(m,idx){const title=prompt('子项标题：');if(!title)return;const type=prompt('类型（link/note）：','note');if(type==='link'){const url=prompt('链接：');appData.knowledgeBase[m][idx].children.push({type:'link',title,url});}else{const content=prompt('内容：','');appData.knowledgeBase[m][idx].children.push({type:'note',title,content});}saveData();renderKnowledge(m);};
window.moveKB=function(m,idx,dir){const arr=appData.knowledgeBase[m];if(idx+dir<0||idx+dir>=arr.length)return;const tmp=arr[idx];arr[idx]=arr[idx+dir];arr[idx+dir]=tmp;saveData();renderKnowledge(m);};
window.moveKBS=function(m,pi,ci,dir){const arr=appData.knowledgeBase[m][pi].children;if(ci+dir<0||ci+dir>=arr.length)return;const tmp=arr[ci];arr[ci]=arr[ci+dir];arr[ci+dir]=tmp;saveData();renderKnowledge(m);};
window.deleteKB=function(m,idx){if(confirm('删除？')){appData.knowledgeBase[m].splice(idx,1);saveData();renderKnowledge(m);}};
window.deleteKBS=function(m,pi,ci){if(confirm('删除？')){appData.knowledgeBase[m][pi].children.splice(ci,1);saveData();renderKnowledge(m);}};

// ==================== 初始化 ====================
function initApp(){
  loadData();
  if(!appData.customCategories) appData.customCategories = {};
  if(!appData.knowledgeBase) appData.knowledgeBase = {};
  renderNavTree();
  switchMainTab('home');
  const h=new Date().getHours();document.getElementById('greeting').innerText=(h<12?'☀️ 早上好':h<18?'🌤 下午好':'🌙 晚上好')+'，小鱼';
}
initApp();

// PWA
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('data:application/javascript,'+encodeURIComponent(`self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});`));
}
</script>
